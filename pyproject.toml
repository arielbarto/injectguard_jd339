[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arielbarto-injectguard_jd339"
version = "0.1.0"
description = "把候选项映射到类别上，算出提示注入防护工程师·数据去重与污染检测的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "arielbarto" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://arielbarto.github.io"
Repository = "https://github.com/arielbarto/injectguard_jd339"
Issues = "https://github.com/arielbarto/injectguard_jd339/issues"

[project.scripts]
injectguard_jd339 = "injectguard_jd339:main"

[tool.setuptools]
py-modules = ["injectguard_jd339"]
